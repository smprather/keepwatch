[project]
name = "watchglass"
version = "2026.10.25.1"
description = "Poll conditions and run actions, from login onward."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Myles Prather" }]
keywords = ["monitoring", "polling", "automation", "relay", "ssh", "systemd", "tui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "rich>=14",
    "rich-click>=1.9",
    "textual>=8",
    "watchdog>=6",
    # password_mode = "conpty" (type a password at a Windows pseudo-console, for servers that refuse SSH_ASKPASS).
    # The PEP 508 environment marker is evaluated by uv and pip, so non-Windows installs skip pywinpty entirely
    # (it ships Windows wheels only) while every Windows install/upgrade gets it without remembering an extra.
    "pywinpty>=2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# `conpty` is now just an alias: pywinpty above already installs on Windows, and `watchglass[conpty]` keeps working
# for installs and scripts written before issue 17.
conpty = ["pywinpty>=2; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/smprather/watchglass"
Repository = "https://github.com/smprather/watchglass"
Issues = "https://github.com/smprather/watchglass/issues"
Documentation = "https://github.com/smprather/watchglass#readme"

[project.scripts]
watchglass = "watchglass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchglass"]

[dependency-groups]
dev = [
    "asyncssh>=2.24.0",
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.6",
    "ty>=0.0.85",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs network access (skipped when WATCHGLASS_SKIP_NETWORK=1 or uv is missing)"]
# Every test is bounded: the e2e ones wait up to two minutes for a real ssh/scp, and a wedged one used
# to burn the runner's whole limit before failing.
timeout = 240

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src", "tests"]
