[project]
name = "keepwatch"
version = "2026.10.5"
description = "Poll conditions and run actions, from login onward."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "rich-click>=1.9",
    "watchdog>=6",
]

[project.scripts]
keepwatch = "keepwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keepwatch"]

[dependency-groups]
dev = [
    "asyncssh>=2.24.0",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs network access (skipped when KEEPWATCH_SKIP_NETWORK=1 or uv is missing)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src", "tests"]
