# PyPI trusted publishing: before the first tag, add a pending publisher for project `watchglass` at
# https://pypi.org/manage/account/publishing/ with owner `smprather`, repository `watchglass`, workflow
# `publish.yml` and environment `pypi`. No token is stored here.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2, pinned to a commit
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@05273c154d09957eb9a2377d9c988fbda431d1c5  # v6.4.0, pinned to a commit
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4, pinned to a commit
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token is stored in the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4, pinned to a commit
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1, pinned to a commit
